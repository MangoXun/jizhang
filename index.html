<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>记账本</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root{
    --bg:#0f1115; --card:#181b21; --line:#262a33;
    --txt:#e8eaee; --dim:#8b93a1; --ok:#3ba55d; --warn:#e0a33a; --bad:#d9534f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;}
  body{padding:16px 14px calc(24px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
  h1{font-size:16px;font-weight:500;letter-spacing:.08em;color:var(--dim);margin:0 0 14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
  .big{font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
  .row{display:flex;justify-content:space-between;align-items:baseline}
  .dim{color:var(--dim);font-size:13px}
  .bar{height:8px;border-radius:99px;background:#22262e;overflow:hidden;margin:12px 0 8px}
  .bar > i{display:block;height:100%;width:0;background:var(--ok);transition:width .35s ease}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 4px}
  .grid div{background:#14171c;border-radius:10px;padding:8px;text-align:center}
  .grid b{display:block;font-size:15px;font-weight:600}
  .grid span{font-size:11px;color:var(--dim)}
  input,button{font:inherit}
  #amt{width:100%;background:#14171c;border:1px solid var(--line);color:var(--txt);
    border-radius:12px;padding:14px 14px;font-size:28px;font-weight:600;letter-spacing:.02em;outline:none}
  #amt::placeholder{color:#4a515e;font-weight:400;font-size:20px}
  .cats{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
  .cat{padding:9px 14px;border-radius:99px;background:#14171c;border:1px solid var(--line);
    color:var(--dim);font-size:14px}
  .cat.on{background:#e8eaee;color:#111318;border-color:#e8eaee;font-weight:600}
  #note{width:100%;background:#14171c;border:1px solid var(--line);color:var(--txt);
    border-radius:12px;padding:12px;font-size:15px;outline:none}
  #save{width:100%;margin-top:12px;padding:15px;border-radius:12px;border:0;
    background:var(--txt);color:#111318;font-size:16px;font-weight:600}
  #save:active{opacity:.8}
  .item{display:flex;justify-content:space-between;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:0}
  .item small{color:var(--dim);font-size:12px}
  .money{font-variant-numeric:tabular-nums;font-weight:600}
  .del{color:#6b7280;font-size:12px;margin-left:10px;padding:6px}
  .empty{color:#5b6270;font-size:13px;text-align:center;padding:18px 0}
  .tip{font-size:12px;color:var(--dim);margin-top:8px;line-height:1.6}
</style>
</head>
<body>
<h1>记账本</h1>

<div class="card">
  <div class="row"><span class="dim">本月还能花</span><span class="dim" id="monthLabel"></span></div>
  <div class="big" id="left">¥0</div>
  <div class="bar"><i id="bar"></i></div>
  <div class="row"><span class="dim" id="spentLine"></span><span class="dim" id="dayLine"></span></div>
  <div class="grid">
    <div><b id="saveEst">¥0</b><span>预计能存</span></div>
    <div><b id="saveGoal">¥800</b><span>目标存款</span></div>
    <div><b id="perDay">¥0</b><span>日均可用</span></div>
  </div>
  <div class="tip" id="tip"></div>
</div>

<div class="card">
  <input id="amt" type="number" inputmode="decimal" step="0.01" placeholder="多少钱">
  <div class="cats" id="cats"></div>
  <input id="note" type="text" placeholder="备注（可不填）">
  <button id="save">记一笔</button>
</div>

<div class="card">
  <div class="row" style="margin-bottom:6px"><span class="dim">本月记录</span><span class="dim" id="cnt"></span></div>
  <div id="list"></div>
</div>

<div class="card">
  <div class="row" style="margin-bottom:8px"><span class="dim">分类小计</span></div>
  <div id="byCat"></div>
</div>

<script>
(function(){
  var BUDGET = 1200;      // 每月可花
  var ALLOW  = 2000;      // 每月生活费
  var GOAL   = 800;       // 每月存
  var CATS = ["吃饭","交通","日用品","话费","电费","零食","其他"];
  var KEY = "jz-v1";

  var state = { cat: "吃饭" };
  var data = load();

  function load(){
    try { return JSON.parse(localStorage.getItem(KEY)) || {items:[]}; }
    catch(e){ return {items:[]}; }
  }
  function persist(){ localStorage.setItem(KEY, JSON.stringify(data)); }
  function ym(ts){ var d=new Date(ts); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
  function ymNow(){ return ym(Date.now()); }
  function thisMonth(){
    var m = ymNow();
    return data.items.filter(function(i){ return ym(i.ts)===m; })
                     .sort(function(a,b){ return b.ts-a.ts; });
  }
  function money(n){ return "¥" + (Math.round(n*100)/100).toLocaleString("zh-CN",{minimumFractionDigits:0,maximumFractionDigits:2}); }

  function daysInMonth(){
    var d=new Date(); return new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  }
  function daysLeft(){
    var d=new Date();
    return Math.max(1, daysInMonth() - d.getDate() + 1);
  }

  function render(){
    var items = thisMonth();
    var spent = items.reduce(function(s,i){ return s+i.amount; }, 0);
    var left  = BUDGET - spent;

    document.getElementById("left").textContent = money(left);
    document.getElementById("left").style.color =
      left < 0 ? "var(--bad)" : (left < 200 ? "var(--warn)" : "var(--txt)");

    var pct = Math.max(0, Math.min(100, spent / BUDGET * 100));
    var bar = document.getElementById("bar");
    bar.style.width = pct + "%";
    bar.style.background = left < 0 ? "var(--bad)" : (left < 200 ? "var(--warn)" : "var(--ok)");

    var d = new Date();
    document.getElementById("monthLabel").textContent = (d.getMonth()+1) + " 月";
    document.getElementById("spentLine").textContent = "已花 " + money(spent) + " / 预算 " + money(BUDGET);

    var dl = daysLeft();
    document.getElementById("dayLine").textContent = "剩 " + dl + " 天";
    document.getElementById("perDay").textContent = money(Math.max(0, left / dl));

    var est = ALLOW - spent;
    document.getElementById("saveEst").textContent = money(Math.max(0, est));
    document.getElementById("saveEst").style.color = est >= GOAL ? "var(--ok)" : "var(--warn)";
    document.getElementById("saveGoal").textContent = money(GOAL);

    var tip = document.getElementById("tip");
    if (left < 0) {
      tip.innerHTML = "已经超了 " + money(-left) + "。剩下的日子从机动里匀，或者这个月的存款目标先降一档。";
    } else if (left < 200) {
      tip.innerHTML = "剩不到 200 了。接下来按日均 " + money(left / dl) + " 花。";
    } else {
      tip.innerHTML = "";
    }

    var list = document.getElementById("list");
    if (!items.length){
      list.innerHTML = '<div class="empty">这个月还没有记录</div>';
    } else {
      list.innerHTML = items.slice(0, 40).map(function(i){
        var t = new Date(i.ts);
        var hh = String(t.getHours()).padStart(2,"0");
        var mm = String(t.getMinutes()).padStart(2,"0");
        return '<div class="item"><div><div>' + esc(i.cat) +
               (i.note ? ' <small>' + esc(i.note) + '</small>' : '') +
               '</div><small>' + (t.getMonth()+1) + '/' + t.getDate() + ' ' + hh + ':' + mm +
               '</small></div><div style="display:flex;align-items:center">' +
               '<span class="money">' + money(i.amount) + '</span>' +
               '<span class="del" data-id="' + i.id + '">删</span></div></div>';
      }).join("");
    }
    document.getElementById("cnt").textContent = items.length + " 笔";

    var by = {};
    items.forEach(function(i){ by[i.cat] = (by[i.cat]||0) + i.amount; });
    var keys = Object.keys(by).sort(function(a,b){ return by[b]-by[a]; });
    document.getElementById("byCat").innerHTML = keys.length
      ? keys.map(function(k){
          var p = Math.round(by[k]/spent*100);
          return '<div class="row" style="padding:6px 0"><span>' + esc(k) +
                 ' <small class="dim">' + p + '%</small></span>' +
                 '<span class="money">' + money(by[k]) + '</span></div>';
        }).join("")
      : '<div class="empty">—</div>';

    persist();
  }

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  // 分类按钮
  var catsEl = document.getElementById("cats");
  catsEl.innerHTML = CATS.map(function(c){
    return '<div class="cat' + (c===state.cat?' on':'') + '" data-c="' + c + '">' + c + '</div>';
  }).join("");
  catsEl.addEventListener("click", function(e){
    var el = e.target.closest(".cat"); if(!el) return;
    state.cat = el.dataset.c;
    [].forEach.call(catsEl.children, function(x){ x.classList.toggle("on", x.dataset.c===state.cat); });
  });

  // 记一笔
  document.getElementById("save").addEventListener("click", function(){
    var amtEl = document.getElementById("amt");
    var v = parseFloat(amtEl.value);
    if (!v || v <= 0) { amtEl.focus(); return; }
    data.items.push({
      id: String(Date.now()) + Math.random().toString(16).slice(2,6),
      amount: Math.round(v*100)/100,
      cat: state.cat,
      note: document.getElementById("note").value.trim().slice(0, 24),
      ts: Date.now()
    });
    amtEl.value = ""; document.getElementById("note").value = "";
    persist(); render();
    amtEl.focus();
  });

  // 删除
  document.getElementById("list").addEventListener("click", function(e){
    var el = e.target.closest(".del"); if(!el) return;
    if (!confirm("删掉这一笔？")) return;
    var id = el.dataset.id;
    data.items = data.items.filter(function(i){ return i.id !== id; });
    persist(); render();
  });

  render();
})();
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js");}</script>
</body>
</html>
